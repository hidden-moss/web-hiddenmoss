<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#000000" />
    <meta name="description" content="Hidden Moss" />
    <meta name="keywords" content="Hidden, Moss, game, maker, Chicago, Shanghai" />
    <title>Hidden Moss</title>
    <link rel="stylesheet" href="css/hm.css" />
    <script>
      document.documentElement.classList.add("js");
      window.logoLoadTimeout = setTimeout(() => {
        if (!document.querySelector("hiddenmoss-identity[data-ready='true']"))
          document.documentElement.classList.add("fallback");
      }, 10000);
    </script>
    <script type="module" src="main.mjs"></script>
    <!-- Existing site analytics. -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-M3ZXFK9CRG"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag() { dataLayer.push(arguments); }
      gtag("js", new Date());
      gtag("config", "G-M3ZXFK9CRG");
    </script>
  </head>
  <body>
    <main aria-label="Hidden Moss">
      <div class="identity-stage">
        <img class="static-logo" src="logo-static.svg" alt="Hiddenmoss" width="1024" height="640" />
        <hiddenmoss-identity autoplay></hiddenmoss-identity>
      </div>
    </main>
    <footer>
      <a href="https://github.com/hidden-moss" aria-label="Hidden Moss on GitHub">GitHub <span aria-hidden="true">↗</span></a>
      <button id="motion-toggle" type="button" hidden>Pause motion</button>
    </footer>
  </body>
</html>
